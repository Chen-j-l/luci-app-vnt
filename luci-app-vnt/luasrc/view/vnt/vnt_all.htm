<%+cbi/valueheader%>
<script type="text/javascript">//<![CDATA[
	function vnt_all(btn)
	{
		XHR.get('<%=luci.dispatcher.build_url("admin", "vpn", "vnt", "vnt_info")%>',
			null,
			function(x,rv)
			{
				var tb = document.getElementById('<%=self.option%>-info');
				if (tb) {
					rv.info = rv.info.replace(/Name:/g, "<font color='#0000FF'><em><b>设备名称：</em></b></font>")
					.replace(/虚拟IP:/g, "<font color='#0000FF'><em><b><br>虚拟IP：</em></b></font>")
					.replace(/虚拟网关:/g, "<font color='#0000FF'><em><b><br>虚拟网关：</em></b></font>")
					.replace(/虚拟网络掩码:/g, "<font color='#0000FF'><em><b><br>虚拟网络掩码：</em></b></font>")
					.replace(/NAT类型:/g, "<font color='#0000FF'><em><b><br>NAT类型：</em></b></font>")
					.replace(/服务器地址:/g, "<font color='#0000FF'><em><b><br>服务器地址：</em></b></font>")
					.replace(/外网IP:/g, "<font color='#0000FF'><em><b><br>外网IP：</em></b></font>")
					.replace(/连接状态:/g, "<font color='#0000FF'><em><b><br>连接状态：</em></b></font>")
					.replace(/WAN口IP:/g, "<font color='#0000FF'><em><b><br>WAN口IP：</em></b></font>")
					.replace(/IPv6:/g, "<font color='#0000FF'><em><b><br>IPv6地址：</em></b></font>")
					.replace(/Connected/g, "<font color='#00CC00'>已连接</font>")
					.replace(/Connecting/g, "<font color='#FF0000'>正在连接</font>")
					.replace(/Cone/g, "<font color='#33B728'>全锥型NAT</font>")
					.replace(/Up:/g, "<font color='#0000FF'><em><b><br>上传总量：</em></b></font>")
					.replace(/Down:/g, "<font color='#0000FF'><em><b><br>下载总量：</em></b></font>")
					.replace(/Symmetric/g, "<font color='#CC0000'>对称型NAT</font>");
					tb.innerHTML = "<br><font color='#FF00FF'>&nbsp;&nbsp;&nbsp;<b><%:vnt-cli --info %></b></font><br>" + "<font color='#FF4500'>" + rv.info + "</font>";
				}
			}
		);

		XHR.get('<%=luci.dispatcher.build_url("admin", "vpn", "vnt", "vnt_all")%>',
			null,
			function(x,rv)
			{
				var tb = document.getElementById('<%=self.option%>-all');
				if (tb) {
					rv.all = rv.all.replace(/Name/g, "<em><b>设备名称</em></b>")
					.replace(/虚拟IP/g, "<em><b>虚拟IP</em></b>")
					.replace(/Status/g, "<em><b>状态</em></b>")
					.replace(/P2P\/Relay/g, "<em><b>直连/转发</em></b>")
					.replace(/Rt/g, "<em><b>延迟（ms）</em></b>")
					.replace(/Online/g, "<font color='#00FF00'>在线</font>")
					.replace(/NAT类型/g, "<em><b>NAT类型</em></b>")
					.replace(/Cone/g, "<font color='#1E90FF'>全锥型NAT</font>")
					.replace(/Symmetric/g, "<font color='#CC0000'>对称型NAT</font>")
					.replace(/外网IP/g, "<em><b>外网IP</em></b>")
					.replace(/WAN口IP/g, "<em><b>WAN口IP</em></b>")
					.replace(/IPv6/g, "<em><b>IPv6地址</em></b>")
					.replace(/server-relay/g, "<font color='#FF3300'>服务器转发</font>")
					.replace(/client-relay/g, "<font color='#CC3300'>客户端转发</font>")
					.replace(/Offline/g, "<font color='#CC0000'>离线</font>")
					.replace(/p2p/g, "<font color='#1E90FF'>直连</font>");
					tb.innerHTML = "<br><font color='#F260CE'>&nbsp;&nbsp;&nbsp;<b><%:vnt-cli --all %></b></font><br>" + rv.all ;
				}
				
			}
		);

		XHR.get('<%=luci.dispatcher.build_url("admin", "vpn", "vnt", "vnt_route")%>',
			null,
			function(x,rv)
			{
				var tb = document.getElementById('<%=self.option%>-route');
				if (tb) {
					rv.route = rv.route.replace(/Destination/g, "<em><b>对端地址</em></b>")
					.replace(/下一跳地址/g, "<em><b>下一跳地址</em></b>")
					.replace(/Metric/g, "<em><b>跳数</em></b>")
					.replace(/Rt/g, "<em><b>延迟（ms）</em></b>")
					.replace(/连接地址/g, "<em><b>连接地址</em></b>")
					tb.innerHTML = "<br><font color='#FF00FF'>&nbsp;&nbsp;&nbsp;<b><%:vnt-cli --route %></b></font><br>" + rv.route ;
				}
			}
		);
		return false;
	}
//]]></script>
<input type="button" class="btn cbi-button cbi-button-apply" value="<%:所有设备信息%>" onclick="return vnt_all(this)" />
<div style="display:block">
<span id="<%=self.option%>-info"><em><%=self.value%></em></span>
<span id="<%=self.option%>-all"><em><%=self.value%></em></span>
<span id="<%=self.option%>-route"><em><%=self.value%></em></span>
</div>
<%+cbi/valuefooter%>
