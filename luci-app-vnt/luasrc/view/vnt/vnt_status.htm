<%
	local uci = require 'luci.model.uci'.cursor()
	protocol="http://"
%>
<script type="text/javascript">//<![CDATA[
XHR.poll(3, '<%=url([[admin]], [[vpn]], [[vnt]], [[status]])%>', null,
	function(x, data) {
		var st = document.getElementById('vnt_status');
		if (data && st) {
			var vntStatus = data.running ? "<span style='color:green;'> 运行中</span>" : "<span style='color:red;'> 未运行</span>";
			var vntstaContent = data.running ? "已运行：" + "<span style='color:#DA70D6;'>" + data.vntSta + "</span>" : "";    
			var vntcpuContent = data.running ? "<br>" + "CPU占用：" + "<span style='color:#6A5ACD;'>" + data.vntCpu + "</span>" : "";  
			var vntramContent = data.running ? "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" + "&nbsp;&nbsp;&nbsp;&nbsp;内存占用：" + "<span style='color:#0000CD;'>" + data.vntRam + "</span>" : ""; 
			var vnttagContent = data.running ? "<br>" + "当前版本：" + "<span style='color:#CD853F;'>" + data.vntTag + "</span>" : ""; 
			st.innerHTML = "<em><b>vnt-cli " + vntStatus + vntstaContent + vntcpuContent + vntramContent + vnttagContent + "</b></em>";          
		}
	}
);
//]]>
</script>
<fieldset class="cbi-section">
	<p id="vnt_status">
		<em><%:Collecting data...%></em>
	</p>
</fieldset>
